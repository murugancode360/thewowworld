<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 220" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&amp;family=Montserrat:ital,wght@1,900&amp;display=swap');

      .brush-pink {
        font-family: 'Caveat', 'Brush Script MT', cursive;
        font-size: 72px;
        font-weight: 700;
        fill: #FF2A75;
      }

      .brush-dark {
        font-family: 'Montserrat', sans-serif;
        font-size: 56px;
        font-weight: 900;
        font-style: italic;
        fill: #222222;
        letter-spacing: 2px;
      }

      .dot-sep {
        fill: #FF2A75;
      }

      /* Underline strokes */
      .pink-underline {
        stroke: #FF2A75;
        stroke-width: 4;
        stroke-linecap: round;
        fill: none;
        opacity: 0.8;
      }

      .dark-underline {
        stroke: #FF2A75;
        stroke-width: 4;
        stroke-linecap: round;
        fill: none;
        opacity: 0.8;
      }
    </style>
  </defs>

  <!-- Dashed Flight Trail & Heart Background -->
  <path d="M 650 110 Q 820 40 1000 60 T 1200 40" stroke="#FF80AB" stroke-width="3" stroke-dasharray="8 8" fill="none" opacity="0.6" />
  <!-- Heart Loop in Trail -->
  <path d="M 900 60 C 890 40 860 50 880 70 L 900 85 L 920 70 C 940 50 910 40 900 60 Z" stroke="#FF80AB" stroke-width="2.5" stroke-dasharray="5 5" fill="none" opacity="0.7" />
  
  <!-- Flying Plane Icon Doodle -->
  <g transform="translate(1200, 20) rotate(-15) scale(0.65)">
    <path d="M0 20 L40 0 L30 25 L50 35 L10 32 L0 40 Z" fill="#FF2A75" />
  </g>

  <!-- Text Sequence Repeat Unit: EXPLORE • TRAVEL • DISCOVER • EXPERIENCE -->
  <g transform="translate(40, 135)">
    <!-- EXPLORE (Pink Brush) -->
    <text x="0" y="0" class="brush-pink">EXPLORE</text>
    <path d="M -5 18 Q 120 28 230 15" class="pink-underline" />
    <circle cx="270" cy="-22" r="7" class="dot-sep" />

    <!-- TRAVEL (Dark Metallic Rough) -->
    <text x="310" y="-8" class="brush-dark">TRAVEL</text>
    <path d="M 310 14 Q 420 20 540 12" class="dark-underline" />
    <!-- Heart doodle under TRAVEL -->
    <path d="M 430 28 C 424 20 405 25 418 38 L 430 46 L 442 38 C 455 25 436 20 430 28 Z" fill="#FF2A75" opacity="0.8" />
    <circle cx="580" cy="-22" r="7" class="dot-sep" />

    <!-- DISCOVER (Pink Brush) -->
    <text x="620" y="0" class="brush-pink">DISCOVER</text>
    <path d="M 615 18 Q 780 28 920 15" class="pink-underline" />
    <circle cx="960" cy="-22" r="7" class="dot-sep" />

    <!-- EXPERIENCE (Dark Metallic Rough) -->
    <text x="1000" y="-8" class="brush-dark">EXPERIENCE</text>
    <path d="M 1000 14 Q 1180 22 1360 10" class="dark-underline" />
    <circle cx="1400" cy="-22" r="7" class="dot-sep" />
  </g>
</svg>